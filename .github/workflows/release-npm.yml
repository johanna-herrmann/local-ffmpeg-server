name: Release NPM

on:
  push:
    tags:
      - 'v*'

jobs:
  release_npm:
    name: publish to NPM
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install dependencies
        run: npm install

      - name: Audit
        run: npm run audit

      - name: Test
        run: npm run test

      - name: Make entrypoint executable
        run: chmod a+x lib/index.js

      - name: Publish to NPM
        uses: JS-DevTools/npm-publish@v3
        with:
          token: ${{ secrets.NPM_TOKEN }}
